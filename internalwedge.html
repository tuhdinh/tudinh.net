<button class="btn btn-primary w-100 mb-3" onclick="generateGCode()">Generate Program</button>
<textarea id="output" class="form-control"></textarea>

<script>
document.body.style.display='block';

function v(id){return parseFloat(document.getElementById(id).value)||0;}
function n(x,d=4){return Number(x).toFixed(d).replace(/\.?0+$/,'');}

function generateGCode(){

let OD=v("OD"),ID=v("ID"),ODCR=OD+.75,IDCR=ID-.75;
let ODCH=v("ODCHAMFERANGLE"),ODCHL=v("ODCHAMFERLENGTH"),ODLEN=v("ODLENGTH");
let TD=v("THREADDIAMETER"),TDL=v("THREADDIAMETERLENGTH");
let BA=v("BEVELANGLE"),IDB=v("IDBEVEL");
let THA=v("THREADANGLE"),TH=v("THREADHEIGHT");
let LL=v("LOADLEAD"),ML=v("MIDLEAD"),SL=v("STABLEAD");
let LT=v("LOADTAPER"),MT=v("MIDTAPER"),ST=v("STABTAPER");
let TLA=v("THREADLENGTHADJ"),DOC=v("DOC"),IDS=v("IDSTOCK"),TNR=v("TNR"),FEED=v("FEED");
let IRD=v("INSERTREFDIA"),IRL=v("INSERTREFLENGTH");
let ROD=v("RUNOUTDIA"),ROA=v("RUNOUTANGLE");
let LFX=v("LOADFLANKXADJ"),MFX=v("MIDFLANKXADJ"),SFX=v("STABFLANKXADJ");
let RIN=Math.round(v("RUNINEXTENT")*10)/10;

if(!(BA>0&&BA<90)){alert("ANGLES MUST BE GREATER 0 AND LESS THAN 90");return;}

BA=Math.tan(BA*Math.PI/180)+0.005;
let T0=TD+(ST*TDL);

let zi=0,x1=0,x2=0;
while(true){
zi+=0.0001;
x1=IDB-((BA*2)*zi);
x2=T0-(ST*zi);
if(x1<ID){alert("CAN NOT FIND THE INTERCEPT");return;}
if((+x1.toFixed(6)- +x2.toFixed(6))<0.0001)break;
}

let XT=BA*TNR; XT=TNR-XT;
let ZT=XT/BA;
let XINT=+x1.toFixed(4);
let XWS=XINT-IDS;
let ZWS=(IDS/(BA*2))+zi+ZT;
let ZW=+ZWS.toFixed(4);
let XSB=+(XWS+((ZWS+.1)*(BA*2))).toFixed(4);
let XE=+(XWS-((IRL-ZW)*ST)).toFixed(4);

ODCH=Math.tan((ODCH/2)*Math.PI/180);
let ODX=2*(TNR-(TNR*ODCH));
let ODZ=TNR-(TNR*ODCH);
let ODS=+(OD-ODX).toFixed(4);

ODCH=Math.tan(v("ODCHAMFERANGLE")*Math.PI/180);
let ODZE=+(ODZ+(ODCHL*ODCH)).toFixed(4);

let passes=Math.round(2*TH/DOC);
if(passes<(2*TH/DOC))passes++;

let TL=0;
while((TL*LL)<IRL)TL++;
TL++; TL+=RIN;

let FX=IRD+TH;
let ENDX=FX-(DOC*(passes-1));
let ENDZ=IRL;

let FA=((Math.tan(THA*Math.PI/180))/2)*DOC;
FA=+FA.toFixed(4);
let FZ=((passes-1)*FA)/2;

let LSZ=(TL*LL)-IRL-TLA-(FZ*3);
let LSX=+(ENDX+(LT*(TL*LL))-(TLA*LT)).toFixed(4)+LFX;
let LEZ=ENDZ+TLA+(FZ*3);
let LEX=+(ENDX-(TLA*LT)+LFX).toFixed(4);

let MSZ=(TL*ML)-IRL-TLA-FZ;
let MSX=+(ENDX+(MT*(TL*ML))-(TLA*MT)).toFixed(4)+MFX;
let MEZ=ENDZ+TLA+FZ;
let MEX=+(ENDX-(TLA*MT)+MFX).toFixed(4);

let TWA=LL/(LL-SL);
let SSZ=((TL*SL)-IRL+(TLA/TWA)-TLA)+FZ;
let SSX=+(ENDX+(ST*(TL*SL))-(TLA*ST)).toFixed(4)+SFX;
let SEZ=(ENDZ+TLA-(TLA/TWA))-FZ;
let SEX=+(ENDX-((TLA+(-TLA/TWA))*ST)+SFX).toFixed(4);

ROA=Math.tan((90-ROA)*Math.PI/180);

let out="%\n(NCPOST BY TU DINH)\n\n";

/* N1 */
out+="N1 (OD)\nG50 S500\nG97 S300 M3\nT0101\n";
out+="G00 X"+n(ODCR)+" Z1.0 M08\n";
out+="Z0.0\n";
out+="G01 X"+n(IDCR)+" F"+FEED+"\n";
out+="G00 Z0.1\nX"+n(ODCR)+"\n";
out+="/G71 U.1 R.1\n/G71 P100 Q101 U-0.005 W0. F"+FEED+"\n";
out+="N100 G00 X"+n(ODS)+"\n";
out+="G01 Z0 F"+FEED+"\n";
out+="G01 X"+n(OD)+" Z-"+n(ODZE)+" F"+FEED+"\n";
out+="Z-"+n(ODLEN)+"\n";
out+="G00 X"+n(ODCR)+"\nN101 G00\n/G70 P100 Q101\n";
out+="G00 Z1.0 M09\nG00 X15.0 Z15.0\nM01\n\n";

/* N2 */
out+="N2 (ID)\nG50 S500\nG97 S300 M3\nT0101\n";
out+="G00 X"+n(ROD)+" Z1.0 M08\n";
out+="G00 Z0.1\n/G71 U.1 R.1\n/G71 P200 Q201 U-0.005 W0. F"+FEED+"\n";
out+="N200 G00 X"+n(XSB)+"\n";
out+="G01 X"+n(XWS)+" Z-"+n(ZW)+" F"+FEED+"\n";
out+="X"+n(XE)+" Z-"+n(IRL)+"\n";
out+="X"+n(ROD)+"\nN201 G00\n/G70 P200 Q201\n";
out+="G00 Z1.0 M09\nG00 X15.0 Z15.0\nM01\n\n";

/* N3 */
out+="N3 (THREADING)\nG50 S500\nG97 S300 M3\nT0505\n";
out+="G00 X"+n(ROD)+" Z1.0 M08\n";

/* LOAD */
out+="(LOAD FLANK)\n";
let lc=1;
for(let i=0;i<passes;i++){
let rz=(((LEX-ROD)/2)*ROA)+LEZ;
out+="("+lc+")\nG00 Z"+n(LSZ)+"\nG00 X"+n(LSX)+"\n";
out+="G32 X"+n(LEX)+" Z-"+n(LEZ)+" F"+LL+"\n";
out+="G32 X"+n(ROD)+" Z-"+n(rz)+"\n";
lc++;
LSX+=DOC;LEX+=DOC;LSZ=+(LSZ+FA).toFixed(4);LEZ=+(LEZ-FA).toFixed(4);
}

/* MID */
out+="(MID FLANK)\n";
for(let i=0;i<passes;i++){
let rz=(((MEX-ROD)/2)*ROA)+MEZ;
out+="("+lc+")\nG00 Z"+n(MSZ)+"\nG00 X"+n(MSX)+"\n";
out+="G32 X"+n(MEX)+" Z-"+n(MEZ)+" F"+ML+"\n";
out+="G32 X"+n(ROD)+" Z-"+n(rz)+"\n";
lc++;
MSX+=DOC;MEX+=DOC;
}

/* STAB */
out+="(STAB FLANK)\n";
for(let i=0;i<passes;i++){
let rz=(((SEX-ROD)/2)*ROA)+SEZ;
out+="("+lc+")\nG00 Z"+n(SSZ)+"\nG00 X"+n(SSX)+"\n";
out+="G32 X"+n(SEX)+" Z-"+n(SEZ)+" F"+SL+"\n";
out+="G32 X"+n(ROD)+" Z-"+n(rz)+"\n";
lc++;
SSX+=DOC;SEX+=DOC;SSZ=+(SSZ-FA).toFixed(4);SEZ=+(SEZ+FA).toFixed(4);
}

out+="G00 Z1.0 M09\nG00 X15.0 Z15.0\nM01\n\n";

/* N4 */
out+="N4 (LASS PASSES)\nG50 S500\nG97 S300 M3\nT0505\n";
out+="G00 X"+n(ROD)+" Z1.0 M08\n";

/* load last */
LSX-=DOC;LEX-=DOC;LSZ=+(LSZ-FA).toFixed(4);LEZ=+(LEZ+FA).toFixed(4);
let rz=(((LEX-ROD)/2)*ROA)+LEZ;
out+="(LOAD FLANK)\n("+lc+")\nG00 Z"+n(LSZ)+"\nG00 X"+n(LSX)+"\n";
out+="G32 X"+n(LEX)+" Z-"+n(LEZ)+" F"+LL+"\n";
out+="G32 X"+n(ROD)+" Z-"+n(rz)+"\n\n"; lc++;

/* mid last */
MSX-=DOC;MEX-=DOC;
rz=(((MEX-ROD)/2)*ROA)+MEZ;
out+="(MID FLANK)\n("+lc+")\nG00 Z"+n(MSZ)+"\nG00 X"+n(MSX)+"\n";
out+="G32 X"+n(MEX)+" Z-"+n(MEZ)+" F"+ML+"\n";
out+="G32 X"+n(ROD)+" Z-"+n(rz)+"\n\n"; lc++;

/* stab last */
SSX-=DOC;SEX-=DOC;SSZ=+(SSZ+FA).toFixed(4);SEZ=+(SEZ-FA).toFixed(4);
rz=(((SEX-ROD)/2)*ROA)+SEZ;
out+="(STAB FLANK)\n("+lc+")\nG00 Z"+n(SSZ)+"\nG00 X"+n(SSX)+"\n";
out+="G32 X"+n(SEX)+" Z-"+n(SEZ)+" F"+SL+"\n";
out+="G32 X"+n(ROD)+" Z-"+n(rz)+"\n";

out+="\nG00 Z1.0 M09\nG00 X15.0 Z15.0\nM30\n%\n";

document.getElementById("output").value=out;
}

// ================= IMAGE SCROLL / PINCH ZOOM =================
const zoomImg = document.querySelector('.image-panel img');

if (zoomImg) {

    let zoomScale = 1;
    const ZOOM_MIN = 0.5;
    const ZOOM_MAX = 3;

    zoomImg.addEventListener('wheel', function (e) {
        e.preventDefault();
        const zoomStep = e.deltaY > 0 ? -0.1 : 0.1;
        zoomScale += zoomStep;
        zoomScale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomScale));
        zoomImg.style.transform = `scale(${zoomScale})`;
    }, { passive: false });

}
// Touch pinch zoom (mobile)
let startDistance = null;
let startScale = zoomScale;

zoomImg.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
        startDistance = getTouchDistance(e.touches);
        startScale = zoomScale;
    }
}, { passive: false });

zoomImg.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2 && startDistance) {
        e.preventDefault();

        const currentDistance = getTouchDistance(e.touches);
        zoomScale = startScale * (currentDistance / startDistance);
        zoomScale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomScale));

        zoomImg.style.transform = `scale(${zoomScale})`;
    }
}, { passive: false });

zoomImg.addEventListener('touchend', function () {
    startDistance = null;
});

// Helper function
function getTouchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
}

</script>
