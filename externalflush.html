<!-- Generate button + output textarea -->
<!-- OUTPUT -->
<div class="container my-4 generate-container">
    <button class="btn btn-primary mb-3 w-100" onclick="generateGCode()">Generate Program</button>
    <textarea id="output" class="form-control" placeholder="G-code will appear here..."></textarea>
</div>

<script>
/* Utility helpers: formatting to match VB.NET style */
    function readFloat(id, fallback = 0) {
        const el = document.getElementById(id);
        if (!el) return fallback;
        const v = parseFloat(el.value);
        return isNaN(v) ? fallback : v;
    }

    function trimNum(n) {
        return String(Number(n.toFixed(6))).replace(/\.?0+$/, '');
    }

    function generateGCode() {

        // ================= READ INPUTS =================
        const THREADDIAMETER = readFloat("ThreadDiameter");
        const THREADDIAMETERLENGTH = readFloat("ThreadDiameterLength");
        const THREADLENGTH = readFloat("ThreadLength");
        const THREADANGLE = readFloat("ThreadAngle");
        const THREADHEIGHT = readFloat("ThreadHeight");
        const LEAD = readFloat("Lead");
        const TAPER = readFloat("Taper");

        const CLIPDIAMETERADJ = readFloat("ClipDiameterAdjustment", 0);
        const DOC = readFloat("DepthOfCut");
        const CLIPLENGTH = readFloat("ClipLength");
        const CLIPLENGTHADJ = readFloat("ClipLengthAdjustment");

        const RUNINDIA = readFloat("RunInDia");
        const RUNOUTDIA = Number(readFloat("RunOutDia").toFixed(5));
        let RUNIN = Math.round(readFloat("RunIn") * 10) / 10;

        // ================= THREAD PASSES =================
        let THREADPASSES = Math.round((2 * THREADHEIGHT) / DOC);
        const TEST = (2 * THREADHEIGHT) / DOC;
        if (THREADPASSES < TEST) THREADPASSES++;

        // ================= THREAD GEOMETRY =================
        let Z1 = RUNIN;
        let Z3 = THREADLENGTH;

        let X1 = RUNINDIA;
        let X2 = THREADDIAMETER - THREADHEIGHT * 2;

        let Z2 = CLIPLENGTH;
        Z2 = Number(Z2.toFixed(4));

        let X3 = RUNINDIA + (THREADLENGTH - Z2) * TAPER;
        X3 = Number(X3.toFixed(4));

        // DOC compensation
        X1 += DOC * (THREADPASSES - 1);
        X3 += DOC * (THREADPASSES - 1);

        // Flank angle
        let FLANKANGLE =
            (Math.tan((THREADANGLE * Math.PI) / 180) / 2) * DOC;
        FLANKANGLE = Number(FLANKANGLE.toFixed(4));

        // ================= CLIP CALC =================
        const ZCOMP = LEAD / 2 + 0.03;

        let CLIPZ1 = Z1 - ZCOMP;
        let CLIPZ2 =
            Math.abs(
                THREADDIAMETERLENGTH -
                (THREADDIAMETER - RUNINDIA) / TAPER
            ) -
            (CLIPDIAMETERADJ / TAPER);

        let CLIPZ3 = CLIPLENGTH + CLIPLENGTHADJ;
        let CLIPZ4 = CLIPZ3 + 0.1;

        let CLIPX1 = RUNINDIA;
        let CLIPX2 = RUNINDIA;
        let CLIPX3 =
            THREADDIAMETER -
            TAPER * (THREADDIAMETERLENGTH - CLIPZ3) +
            CLIPDIAMETERADJ;
        let CLIPX4 = CLIPX3 + 0.2;

        // Round clip values
        CLIPX1 = Number(CLIPX1.toFixed(4));
        CLIPX2 = Number(CLIPX2.toFixed(4));
        CLIPX3 = Number(CLIPX3.toFixed(4));
        CLIPX4 = Number(CLIPX4.toFixed(4));

        CLIPZ1 = Number(CLIPZ1.toFixed(4));
        CLIPZ2 = Number(CLIPZ2.toFixed(4));
        CLIPZ3 = Number(CLIPZ3.toFixed(4));
        CLIPZ4 = Number(CLIPZ4.toFixed(4));

        // ================= POSTING =================
        let post = "%\n";
        post += "(NCPOST BY TU DINH)\n";
        post += "N3 (THREADING)\n";
        post += "G50 S500\n";
        post += "G97 S300 M3\n";
        post += "T0505\n";
        post += `G00 X${trimNum(RUNOUTDIA)} Z1.0 M08\n`;

        let LINECOUNT = 1;
        let THREADCOUNT = THREADPASSES;

        // ================= THREAD PASSES =================
        while (THREADCOUNT > 0) {
            post += `(${LINECOUNT})\n`;
            post += `G00 Z${trimNum(Z1)}\n`;
            post += `G00 X${trimNum(X1)}\n`;
            post += `G32 Z-${trimNum(Z2)} F${trimNum(LEAD)}\n`;
            post += `G32 X${trimNum(X3)} Z-${trimNum(Z3)} F${trimNum(LEAD)}\n`;
            post += `X${trimNum(RUNOUTDIA)}\n`;

            LINECOUNT++;
            THREADCOUNT--;

            X1 -= DOC;
            X3 -= DOC;
            Z1 = Number((Z1 + FLANKANGLE).toFixed(4));
            Z3 = Number((Z3 - FLANKANGLE).toFixed(4));
        }

        // ================= LAST PASS =================
        post += "G00 Z1.0 M09\n";
        post += "G30 U.0 W.0\n";
        post += "M01\n\n";

        post += "N4 (LASS PASSES)\n";
        post += "G50 S500\n";
        post += "G97 S300 M3\n";
        post += "T0505\n";
        post += `G00 X${trimNum(RUNOUTDIA)} Z1.0 M08\n`;

        // Undo last decrement
        X1 += DOC;
        X3 += DOC;
        Z1 = Number((Z1 - FLANKANGLE).toFixed(4));
        Z3 = Number((Z3 + FLANKANGLE).toFixed(4));

        post += `(${LINECOUNT})\n`;
        post += `G00 Z${trimNum(Z1)}\n`;
        post += `G00 X${trimNum(X1)}\n`;
        post += `G32 Z-${trimNum(Z2)} F${trimNum(LEAD)}\n`;
        post += `G32 X${trimNum(X3)} Z-${trimNum(Z3)} F${trimNum(LEAD)}\n`;
        post += `X${trimNum(RUNOUTDIA)}\n`;

        post += "G00 Z1.0 M09\n";
        post += "G30 U.0 W.0\n";
        post += "M01\n\n";

        // ================= CLIP =================
        post += "N5 (CLIP)\n";
        post += "G50 S500\n";
        post += "G97 S300 M3\n";
        post += "T0505\n";
        post += `G00 X${trimNum(RUNOUTDIA)} Z1.0 M08\n`;

        post += `G00 X${trimNum(CLIPX1)} Z${trimNum(CLIPZ1)}\n`;
        post += `G32 X${trimNum(CLIPX2)} Z-${trimNum(CLIPZ2)} F${trimNum(LEAD)}\n`;
        post += `G32 X${trimNum(CLIPX3)} Z-${trimNum(CLIPZ3)}\n`;
        post += `G32 X${trimNum(CLIPX4)} Z-${trimNum(CLIPZ4)}\n`;

        post += "\nG00 Z1.0 M09\n";
        post += "G30 U.0 W.0\n";
        post += "M30\n%\n";

        document.getElementById("output").value = post;
    }




// ================= IMAGE SCROLL / PINCH ZOOM =================
const zoomImg = document.querySelector('.image-panel img');

let zoomScale = 1;
const ZOOM_MIN = 0.5;
const ZOOM_MAX = 3;

// Mouse wheel zoom (desktop)
zoomImg.addEventListener('wheel', function (e) {
    e.preventDefault();

    const zoomStep = e.deltaY > 0 ? -0.1 : 0.1;
    zoomScale += zoomStep;
    zoomScale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomScale));

    zoomImg.style.transform = `scale(${zoomScale})`;
}, { passive: false });

// Touch pinch zoom (mobile)
let startDistance = null;
let startScale = zoomScale;

zoomImg.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
        startDistance = getTouchDistance(e.touches);
        startScale = zoomScale;
    }
}, { passive: false });

zoomImg.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2 && startDistance) {
        e.preventDefault();

        const currentDistance = getTouchDistance(e.touches);
        zoomScale = startScale * (currentDistance / startDistance);
        zoomScale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomScale));

        zoomImg.style.transform = `scale(${zoomScale})`;
    }
}, { passive: false });

zoomImg.addEventListener('touchend', function () {
    startDistance = null;
});

// Helper function
function getTouchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
}

</script>
