<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
<title>TuDinh.Net Login</title>
<link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800&display=swap">
<link rel="stylesheet" href="assets/css/externalnpsthread.css">
<link rel="stylesheet" href="assets/css/Features-Image-icons.css">
<link rel="stylesheet" href="assets/css/Features-Image-images.css">
<link rel="stylesheet" href="assets/css/Login-Center.css">
<link rel="stylesheet" href="assets/css/Wave-Animation-Circle-and-Square.css">
</head>

<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="text-center mb-4">Login with Email Link</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <button type="submit" id="loginBtn" class="btn btn-success w-100">Send Login Link</button>
            </form>
            <p class="text-success mt-3" id="message"></p>
            <p class="text-danger mt-3" id="error"></p>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// --- Firebase config ---
const firebaseConfig = {
  apiKey: "AIzaSyBXqrLMnNtRnQz7rNqf5eKf_oPd80zcuPI",
  authDomain: "tudinhnet.firebaseapp.com",
  projectId: "tudinhnet",
  storageBucket: "tudinhnet.firebasestorage.app",
  messagingSenderId: "563689283361",
  appId: "1:563689283361:web:d8e0f48889bcc0f68a6860",
  measurementId: "G-56RGXDFED8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const messageEl = document.getElementById("message");
const errorEl = document.getElementById("error");

// --- Handle form submit ---
loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.innerText = "";
    messageEl.innerText = "";
    loginBtn.disabled = true;

    const email = document.getElementById("email").value;

    try {
        const actionCodeSettings = {
            url: window.location.origin + "/index.html", // redirect after clicking email link
            handleCodeInApp: true
        };
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);
        window.localStorage.setItem('emailForSignIn', email);
        messageEl.innerText = "Check your email for the login link!";
    } catch (err) {
        errorEl.innerText = err.message;
        loginBtn.disabled = false; // re-enable on error
    }
});

// --- Complete login if coming from email link ---
if (isSignInWithEmailLink(auth, window.location.href)) {
    (async () => {
        let email = window.localStorage.getItem('emailForSignIn');
        if (!email) {
            email = prompt("Please enter your email for verification");
        }
        try {
            await signInWithEmailLink(auth, email, window.location.href);
            window.localStorage.removeItem('emailForSignIn');
            window.location.href = "index.html"; // redirect after login
        } catch (err) {
            errorEl.innerText = err.message;
        }
    })();
}
</script>

<script src="assets/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
