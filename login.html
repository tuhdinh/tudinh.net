<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
<title>TuDinh.Net Login</title>

<link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,600,700,800&display=swap">
<link rel="stylesheet" href="assets/css/Login-Center.css">
</head>

<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <h2 class="text-center mb-4">Login</h2>

            <form id="loginForm">
                <div class="mb-3">
                    <!-- If this is really a username, Firebase still treats it as email -->
                    <input type="email" id="email" class="form-control"
                           placeholder="Email" required>
                </div>

                <div class="mb-3">
                    <input type="password" id="password" class="form-control"
                           placeholder="Password" required>
                </div>

                <button type="submit" class="btn btn-success w-100" id="loginBtn">
                    Login
                </button>
            </form>

            <p class="text-success mt-3" id="message"></p>
            <p class="text-danger mt-3" id="error"></p>

        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
    getAuth, 
    signInWithEmailAndPassword,
    setPersistence,
    browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// --- Firebase config ---
const firebaseConfig = {
  apiKey: "AIzaSyBXqrLMnNtRnQz7rNqf5eKf_oPd80zcuPI",
  authDomain: "tudinhnet.firebaseapp.com",
  projectId: "tudinhnet",
  storageBucket: "tudinhnet.firebasestorage.app",
  messagingSenderId: "563689283361",
  appId: "1:563689283361:web:d8e0f48889bcc0f68a6860",
  measurementId: "G-56RGXDFED8"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Elements
const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const messageEl = document.getElementById("message");
const errorEl = document.getElementById("error");

loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.innerText = "";
    messageEl.innerText = "";
    loginBtn.disabled = true;

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        // 🔐 SESSION-ONLY LOGIN (browser close = logout)
        await setPersistence(auth, browserSessionPersistence);

        await signInWithEmailAndPassword(auth, email, password);

        messageEl.innerText = "Login successful!";
        window.location.replace("index.html");
    } catch (err) {
        errorEl.innerText = err.message;
        loginBtn.disabled = false;
    }
});
</script>

<script src="assets/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
